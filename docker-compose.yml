# Ejecución local completa: `docker compose up` → http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_socios
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestion_socios
    command: sh -c "npx prisma db push && npm run db:seed && npm run dev"

volumes:
  pgdata:
